name: multi-job-demo

on: 
   workflow_dispatch:

jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
        - name: build the app
          run: echo "Building the app"

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
        - name: Run test
          run: echo "Running tests"
    
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
        - name: Deploy the app
          run: echo "Deploying the app"

    
          

    

