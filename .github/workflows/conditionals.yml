name: conditions demo

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  # 1,2: branch condition and failure()
  check-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Print on main only
        if: github.ref == 'refs/heads/main'
        run: echo "hello from main"

      - name: Real failure (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: exit 1

      - name: Running if previous failed
        if: failure()
        run: echo "Previous step failed"

  # 3: push only
  on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Running on push
        run: echo "This runs on push"

  # 4: continue-on-error
  on-error:
    runs-on: ubuntu-latest
    steps:
      - name: Failing step
        id: fail
        continue-on-error: true
        run: python ---version

      - name: Running on error
        if: steps.fail.outcome == 'failure'
        run: echo "The previous step failed, but the job continued"