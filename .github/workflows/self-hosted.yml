name: self-hosted runner 

on: 
    workflow_dispatch:
    push:

jobs:
    demo: 
        runs-on: [self-hosted, my-linux-runner] #added new label
        steps:
            - name: print hostname of the machine
              run: echo "Runner's Hostname:" ${{ runner.name }}

            - name: print the working directory
              run: echo "Working Directory:" ${{ github.workspace }}

            - name: create a file and verify it exists
              run: |
                echo "Hello, Habeeb!!" > hello.txt
                if [ -f hello.txt ]; then
                    echo "File created successfully."
                else
                    echo "File creation failed."
                fi
