name: Upload Artifact Demo

on:
  workflow_dispatch:

jobs:
    upload-artifact:
        runs-on: ubuntu-latest
        steps:
            - name: Create test report with file
              run: |
                mkdir testreport
                echo "GitHub Actions Artifact Demo" > testreport/day44-report.txt
                echo "Day 44 completed successfully." >> testreport/day44-report.txt

            - name: Upload artifact
              uses: actions/upload-artifact@v4 #stable version
              with:
                name: day44-report
                path: testreport/day44-report.txt