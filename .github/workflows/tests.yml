name: Run Tests

on:
    workflow_dispatch:
#   push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests
        run: |
          echo "Running tests..."
          if [ -f fail-tests.txt ]; then       
            echo "Tests failed"
            exit 1
          fi
          echo "All tests passed"