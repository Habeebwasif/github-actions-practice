name: pr-check-req
on: 
  workflow_dispatch:
  pull_request: 
    branches: [main] #limits it to PRs targeting main
    types: [opened, synchronize] #runs when a PR is opened

jobs:
    pr-check:
      runs-on: ubuntu-latest
      steps:
        - name: Branch check
          run: echo "PR check running for branch :" ${{ github.head_ref}} #it is the PR’s source branch
       
