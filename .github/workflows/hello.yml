# workflow name
name: Hello yaml

# trigger event on every push
on:
  workflow_dispatch:
  #push:

# jobs to run in this workflow
jobs:
  greet:

  # specify the machine runner (OS)
    runs-on: ubuntu-latest
    
    steps:
    # step 1 - pre-built code check
      - name: code checkout
        uses: actions/checkout@v7
        
    # step 2
      - name: greets user
        run: echo "Hello from GitHub Actions!" 

    # step 3
      - name: print date and time
        run: date

    # step 4
      - name: branch name (which triggered)
        run: echo "Branch:" ${{ github.ref_name }}

    # step 5
      - name: list files in repo
        run: ls -la

    # step - demo
    # - name: break it on purpose
    #   run: ehco "this will fail"

    # step 6
      - name: print runner os
        run: echo "Running on:" ${{ runner.os }}
