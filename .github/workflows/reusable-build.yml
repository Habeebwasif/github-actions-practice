name: Reusable workflow

on:
  workflow_call:

    inputs:

      app_name:
        description: 'name of your app'
        type: string
        required: true

      environment:
        description: 'Environment to deploy to'
        type: string
        default: 'staging'
        required: true

    secrets:

      docker_token:
        description: 'Docker token for authentication'
        required: true

    outputs:
      build_version:
        description: 'Generated build version'
        value: ${{ jobs.reusable.outputs.build_version }}

jobs:
  
  reusable:
    runs-on: ubuntu-latest
    outputs:
     build_version: ${{ steps.version.outputs.build_version }}

    steps:

      - name: Check out the code
        uses: actions/checkout@v7

      - name: App name & environment
        run: echo  "Building ${{ inputs.app_name }} for  ${{ inputs.environment }}"

      - name: Check docker token
        env:
          DOCKER_TOKEN: ${{ secrets.docker_token }}
        run: |
          if [ -n "$DOCKER_TOKEN" ]; then
            echo "Docker token is set: true"
          else
            echo "Docker token is set: false"
          fi

      - name: Generate build version
        id: version
        run: |
          VERSION="v1.0-${GITHUB_SHA::7}"
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated $VERSION"
          