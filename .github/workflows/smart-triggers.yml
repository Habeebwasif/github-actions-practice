name: Smart Triggers
 
on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'src/**'
      - 'app/**'
 
jobs:
  source-code-changes:
    runs-on: ubuntu-latest
 
    steps:
      - name: Show what triggered this run
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered because src/ or app/ changed"
 